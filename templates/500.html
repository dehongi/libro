{% extends 'base.html' %}
{% load i18n %}

{% block title %}
  {% translate 'Server Error' %}| Libro
{% endblock %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center text-center">
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-5">
            <div class="display-1 text-danger mb-4">
              <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h1 class="h2 mb-4">{% translate 'Server Error' %}</h1>
            <p class="lead text-muted mb-4">
              {% translate 'Sorry, something went wrong on our end. Please try again later.' %}
            </p>
            <a href="{% url 'website:home' %}" class="btn btn-primary"><i class="bi bi-house me-2"></i>{% translate 'Return Home' %}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
