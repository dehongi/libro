<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="icon" type="image/png" href="/static/pwa/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/pwa/favicon.svg" />
    <link rel="shortcut icon" href="/static/pwa/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Libro Books" />
    <link rel="manifest" href="/static/pwa/site.webmanifest" />
    <!-- End PAW -->

    <title>
      {% block title %}
        {{ title }} | Libro
      {% endblock %}
    </title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    {% block extra_css %}

    {% endblock %}
  </head>
  <body>
    <header>
      {% include 'includes/navbar.html' %}
    </header>

    <main class="container py-4">
      {% if messages %}
        {% include 'includes/messages.html' %}
      {% endif %}

      {% block content %}

      {% endblock %}
    </main>

    <footer class="footer mt-auto py-3 bg-light">
      {% include 'includes/footer.html' %}
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

    {% block extra_js %}

    {% endblock %}
  </body>
</html>
