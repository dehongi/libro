{% extends 'base.html' %}
{% load i18n %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">{% translate 'Sign Up' %}</h2>
          <form method="post" novalidate>
            {% csrf_token %}
            {{ form }}
            <button type="submit" class="btn btn-primary w-100">{% translate 'Create Account' %}</button>
          </form>
          <div class="text-center mt-3">
            <p>
              {% translate 'Already have an account?' %}
              <a href="{% url 'login' %}">{% translate 'Log In' %}</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
