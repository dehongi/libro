{% extends 'base.html' %}

{% block content %}
  <h1>Authors</h1>
  <a href="{% url 'libro:author-create' %}" class="btn btn-primary">Add Author</a>
  <ul>
    {% for author in authors %}
      <li>
        <a href="{% url 'libro:author-detail' author.slug %}">{{ author.name }}</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
