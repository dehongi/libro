{% extends 'libro/form_base.html' %}
{% load i18n %}

{% block title %}
  {% if form.instance.pk %}
    {% translate 'Edit Book' %}
  {% else %}
    {% translate 'Add New Book' %}
  {% endif %}
{% endblock %}

{% block content %}
  <h1 class="my-5">{{ title }}</h1>
  <form class="my-5" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary">{% translate 'Save' %}</button>
    <a href="{% url 'libro:book-list' %}" class="btn btn-secondary">{% translate 'Cancel' %}</a>
  </form>
{% endblock %}
