{% extends "base.html" %}

{% block content %}
<h1>{{ author.name }}</h1>
<div>
    {% if author.photo %}
        <img src="{{ author.photo.url }}" alt="{{ author.name }}">
    {% endif %}
    <p>{{ author.biography }}</p>
    <p>Birth date: {{ author.birth_date|default:"Unknown" }}</p>
    <p>Death date: {{ author.death_date|default:"" }}</p>
</div>
<a href="{% url 'author-update' author.pk %}" class="btn btn-primary">Edit</a>
<a href="{% url 'author-delete' author.pk %}" class="btn btn-danger">Delete</a>
{% endblock %}
