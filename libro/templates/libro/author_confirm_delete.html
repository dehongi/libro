{% extends 'base.html' %}

{% block content %}
  <h1>Delete Author</h1>
  <p>Are you sure you want to delete "{{ author.name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'author-detail' author.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
